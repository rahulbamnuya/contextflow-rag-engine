version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MongoDB Service (For chat history and user auth database)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: contextflow_rag_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Qdrant Vector Database Service
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contextflow_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI RAG Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contextflow_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # If MONGO_URI/QDRANT_URL is not set in .env, default to the local docker services
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Streamlit Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: contextflow_rag_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Map the Python backend URL inside the docker bridge network
      - PYTHON_BASE_URL=http://backend:8000
      - RUST_BASE_URL=http://backend:8000/auth
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
